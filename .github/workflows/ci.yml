# Why: Continuous Integration pipeline running automated backend tests with coverage
# and frontend production build/lint verification on every push and pull request.

name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  backend-tests:
    name: Backend Pytest & Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stylify
          POSTGRES_PASSWORD: stylify_pass
          POSTGRES_DB: stylify_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://stylify:stylify_pass@localhost:5432/stylify_db
      JWT_SECRET: ci_github_actions_secret_key_min_32_chars_ok!
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      EMAIL_BACKEND: console
      CORS_ORIGINS: "http://localhost:5173"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alembic Database Migrations
        run: |
          alembic upgrade head

      - name: Run Pytest with Code Coverage
        run: |
          pytest --cov=app --cov-report=term-missing --cov-report=xml -v

  frontend-build:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node Dependencies
        run: npm ci

      - name: Run Oxlint Linter
        run: npm run lint

      - name: Build Production Bundle
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8000
