# Why: Spins up a local PostgreSQL instance for development.
# Run: docker compose up -d

services:
  db:
    image: postgres:16-alpine
    container_name: stylify_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: stylify
      POSTGRES_PASSWORD: stylify_pass
      POSTGRES_DB: stylify_db
    ports:
      - "5432:5432"            # host:container — matches DATABASE_URL
    volumes:
      - pgdata:/var/lib/postgresql/data   # persist data across restarts

volumes:
  pgdata:

